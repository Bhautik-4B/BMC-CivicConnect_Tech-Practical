services:
  # 1. Fullstack Monorepo Web Service (Serves API + Socket.io + Frontend SPA)
  - type: web
    name: bmc-civicconnect-fullstack
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://bmc-civicconnect-fullstack.onrender.com

  # 2. Standalone Backend API (For decoupled deployments e.g. Vercel Frontend + Render API)
  - type: web
    name: bmc-civicconnect-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=@bmc/shared && npm run build --workspace=@bmc/server
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
